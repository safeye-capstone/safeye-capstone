spring:
  profiles:
    active: dev
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

app:
  upload:
    max-image-size: 10485760 # 10MB
    max-video-size: 52428800 # 50MB
  image:
    allowed-exts: jpg, jpeg, png, webp
  simulator:
    push-rate: 5000
    consume-delay: 100

logging:
  level:
    org.hibernate.SQL: debug
    com.safeye.backend: trace
    org.hibernate.orm.jdbc.bind: trace

vlm:
  server:
    url: http://localhost:8100
    timeout: 30 # 이미지 분석 타임아웃 (30초)
    video-timeout: 600 # 영상 분석 타임아웃 (10분)